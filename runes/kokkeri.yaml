  # Egen knap i panelet: skifter app-filerne uden at geninstallere. /data bliver.
  update:
    image: "{{NODE_IMAGE}}"
    label: "Opdater Kokkeri"
    script: |
      set -eu
      echo "Opdaterer Kokkeri til v29 ..."
      echo "Node: $(node --version)"

      if ! mkdir .kokkeri-laas 2>/dev/null; then
        echo "[fejl] en anden opdatering er allerede i gang."
        echo "Vent til den er faerdig, eller genstart Kokkeri og proev igen."
        exit 1
      fi
      trap 'rm -rf .kokkeri-laas .kokkeri-ny' EXIT INT TERM

      rm -rf .kokkeri-ny .kokkeri-gammel
      mkdir -p .kokkeri-ny

      node -e 'const A=[];for(let c=33;c<127;c++)if(c!==123&&c!==125&&c!==92)A.push(c);const M=new Int16Array(128).fill(-1);for(let i=0;i<85;i++)M[A[i]]=i;const s=require("fs").readFileSync(0,"utf8").replace(/\s+/g,"");const h=s.length/5|0,r=s.length%5,o=Buffer.alloc(h*4+(r?r-1:0));let q=0;for(let i=0;i<h;i++){let v=0;for(let j=0;j<5;j++)v=v*85+M[s.charCodeAt(q++)];o.writeUInt32BE(v>>>0,i*4);}if(r){let v=0;for(let j=0;j<5;j++)v=v*85+(j<r?M[s.charCodeAt(q+j)]:84);const b=Buffer.alloc(4);b.writeUInt32BE(v>>>0);b.copy(o,h*4,0,r-1);}process.stdout.write(require("zlib").brotliDecompressSync(o));' <<'YGG_PAYLOAD_EOF' | tar x -C .kokkeri-ny
