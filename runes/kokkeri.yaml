# Kokkeri - opskrifts-bibliotek, madplan og indkoebsliste som Yggdrasil-rune
# Importerer opskrifter fra URL'er (schema.org/Recipe), uge-madplan med iCal-feed,
# indkoebslister, koekkentimere og valgfri AI-assistent (Claude API).
# Alt (app + SQLite-database) ligger i serverens egen datamappe.
gameskill:
  id: kokkeri
  name: "Kokkeri"
  category: "Apps"
  description: "Opskrifts-bibliotek a la Paprika: importer opskrifter fra URL'er (siden laeses automatisk), uge-madplan med iCal-abonnement, indkoebslister fra opskrifter, koekkentimere, kogetilstand der holder skaermen taendt og valgfri AI-assistent (Claude API-noegle). Flere brugere, passkey-login. Egen SQLite-database - ingen eksterne afhaengigheder."
  author: "andreas"
  version: 24
  icon: "app"

  docker:
    image: "node:24-alpine"

  variables:
    - key: APP_NAME
      name: "Appens navn"
      type: string
      default: "Kokkeri"

  install:
    image: "node:24-alpine"
    script: |
      set -eu
      echo "Installerer Kokkeri v24 ..."

      # App-filerne ligger som brotli-komprimeret tar i base85 - se build_rune.py
      node -e 'const A=[];for(let c=33;c<127;c++)if(c!==123&&c!==125&&c!==92)A.push(c);const M=new Int16Array(128).fill(-1);for(let i=0;i<85;i++)M[A[i]]=i;const s=require("fs").readFileSync(0,"utf8").replace(/\s+/g,"");const h=s.length/5|0,r=s.length%5,o=Buffer.alloc(h*4+(r?r-1:0));let q=0;for(let i=0;i<h;i++){let v=0;for(let j=0;j<5;j++)v=v*85+M[s.charCodeAt(q++)];o.writeUInt32BE(v>>>0,i*4);}if(r){let v=0;for(let j=0;j<5;j++)v=v*85+(j<r?M[s.charCodeAt(q+j)]:84);const b=Buffer.alloc(4);b.writeUInt32BE(v>>>0);b.copy(o,h*4,0,r-1);}process.stdout.write(require("zlib").brotliDecompressSync(o));' <<'YGG_PAYLOAD_EOF' | tar x
